[package]
name = "gates-core"
description = "Telamon Gates without Qt: conversations, their files, Markdown and the chat backend interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# HTTP to llama-server (127.0.0.1, or an address on the LAN) and HTTPS to
# Hugging Face for model downloads.
# TLS through the system's OpenSSL and certificate store (smaller than a
# bundled one, and it trusts what the system trusts).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Web search for the models: parsing and joining the addresses of pages. The
# search API key is kept by libsecret's `secret-tool` (web/keys.rs), not by a
# Secret Service client in the binary.
url = "2"
