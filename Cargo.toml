[workspace]
resolver = "3"
members = ["crates/gates-core", "apps/telamon-gates"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/telamon-gates"
rust-version = "1.92"

[workspace.dependencies]
# The Telamon framework crates (startup, settings, logging, crash reports).
# Telamon.Ui is not pinned here: it is the installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.10" }

# Size over speed: fat LTO with one codegen unit and opt-level "s" made the
# stripped binary 8.56 MB -> 6.90 MB (-19%) with no change in start-up or in
# the CPU a reply takes (docs/BACKEND.md, Performance). Not panic = "abort":
# the web fetch and the chat catch panics (catch_unwind).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
